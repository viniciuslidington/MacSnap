name: Website

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "website/**",
        "scripts/build-site-locales.py",
        "scripts/check-site.py",
        "scripts/test-site-motion.cjs",
        "scripts/update-distribution.py",
        "scripts/test-update-distribution.py",
        "scripts/test-dmg-distribution.py",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "site/**",
        "website/**",
        "scripts/build-site-locales.py",
        "scripts/check-site.py",
        "scripts/test-site-motion.cjs",
        "scripts/update-distribution.py",
        "scripts/test-update-distribution.py",
        "scripts/test-dmg-distribution.py",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Approved MacSnap Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check HTML, assets, links and sharing metadata
        run: python3 scripts/check-site.py
      - name: Check automatic preview lifecycle
        run: node --test scripts/test-site-motion.cjs
      - name: Check update feed publication policies
        run: python3 scripts/test-update-distribution.py
      - name: Check installer rollout policies
        run: python3 scripts/test-dmg-distribution.py

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Preserve approved update feed
        run: python3 scripts/update-distribution.py hydrate --site site
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
