name: Prepare MacSnap Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to prepare as an unpublished candidate
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: macsnap-release-candidate
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MACSNAP_UPDATE_PUBLIC_KEY: ${{ vars.MACSNAP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated disk image tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install -r scripts/requirements-dmg.txt
      - name: Validate candidate identity and configuration
        run: |
          python3 - <<'PY'
          import base64, os, plistlib, re
          info = plistlib.load(open('Resources/Info.plist', 'rb'))
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Invalid release tag'
          assert tag == 'v' + info['CFBundleShortVersionString'], 'Tag/version mismatch'
          assert len(base64.b64decode(os.environ['MACSNAP_UPDATE_PUBLIC_KEY'], validate=True)) == 32, 'Configure the public update key first'
          PY
      - name: Test app and distribution policies
        run: |
          swift test
          python3 scripts/test-update-distribution.py
          python3 scripts/test-dmg-distribution.py
      - name: Build universal application
        run: |
          swift build -c release --arch arm64 --arch x86_64
          RELEASE_BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/MacSnap"
          RELEASE_ARCHS="$(lipo -archs "$RELEASE_BIN")"
          [[ " $RELEASE_ARCHS " == *" arm64 "* ]]
          [[ " $RELEASE_ARCHS " == *" x86_64 "* ]]
          python3 scripts/update-distribution.py assemble --binary "$RELEASE_BIN" --output "$RUNNER_TEMP/candidate/MacSnap.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/candidate/MacSnap.app" "$RUNNER_TEMP/candidate/MacSnap.app.zip"
      - name: Build verified drag-to-Applications installer
        run: '"$RUNNER_TEMP/dmg-tools/bin/python" scripts/build-dmg.py build --app "$RUNNER_TEMP/candidate/MacSnap.app" --image "$RUNNER_TEMP/candidate/MacSnap.dmg"'
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > "$RUNNER_TEMP/candidate/notes.md"
          cat >> "$RUNNER_TEMP/candidate/notes.md" <<'EOF'

          ## Accessibility after updating / Acessibilidade após atualizar

          This free distribution uses ad-hoc app signing. macOS may require renewing Accessibility authorization after an update, even if the old MacSnap entry is still enabled. If window snapping stops, remove that entry in System Settings → Privacy & Security → Accessibility, then add `/Applications/MacSnap.app` again. Restart versions 1.0.9 and earlier after renewing access. Reinstalling the app is not necessary.

          Esta distribuição gratuita usa assinatura ad hoc. Após atualizar, o macOS pode exigir renovar a autorização de Acessibilidade, mesmo que a entrada antiga do MacSnap continue ativada. Se o encaixe parar, remova essa entrada em Ajustes do Sistema → Privacidade e Segurança → Acessibilidade e adicione `/Applications/MacSnap.app` novamente. Nas versões 1.0.9 e anteriores, encerre e abra o app depois de renovar o acesso. Não é necessário reinstalar.
          EOF
      - name: Sign and verify candidate feed
        env:
          MACSNAP_UPDATE_PRIVATE_KEY: ${{ secrets.MACSNAP_UPDATE_PRIVATE_KEY }}
        run: |
          python3 scripts/update-distribution.py prepare --archive "$RUNNER_TEMP/candidate/MacSnap.app.zip" --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/candidate/notes.md" --output "$RUNNER_TEMP/candidate/appcast.xml"
          python3 - <<'PY'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate'
          names = ['MacSnap.app.zip', 'MacSnap.dmg']
          (root / 'SHA256.txt').write_text(''.join(f'{hashlib.sha256((root / name).read_bytes()).hexdigest()}  {name}\n' for name in names))
          PY
      - name: Upload unpublished draft for staging acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "MacSnap $RELEASE_TAG — candidate" --notes-file "$RUNNER_TEMP/candidate/notes.md"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/candidate/MacSnap.app.zip" "$RUNNER_TEMP/candidate/MacSnap.dmg" "$RUNNER_TEMP/candidate/appcast.xml" "$RUNNER_TEMP/candidate/SHA256.txt"
          echo 'Draft only. Test the ZIP update and DMG installation, then approve both SHA-256 digests in Publish Approved MacSnap Release.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/candidate/SHA256.txt" >> "$GITHUB_STEP_SUMMARY"
