name: Release MacSnap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Universal App and Release
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Tests
        run: swift test

      - name: Build Universal Release Binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble MacSnap.app Bundle
        run: |
          mkdir -p MacSnap.app/Contents/MacOS
          mkdir -p MacSnap.app/Contents/Resources
          # Resolve the final product rather than an architecture-specific intermediate.
          RELEASE_BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/MacSnap"
          RELEASE_ARCHS="$(lipo -archs "$RELEASE_BIN")"
          [[ " $RELEASE_ARCHS " == *" arm64 "* ]]
          [[ " $RELEASE_ARCHS " == *" x86_64 "* ]]
          cp "$RELEASE_BIN" MacSnap.app/Contents/MacOS/MacSnap
          chmod +x MacSnap.app/Contents/MacOS/MacSnap
          cp Resources/Info.plist MacSnap.app/Contents/Info.plist
          if [ -f "Resources/AppIcon.icns" ]; then
            cp Resources/AppIcon.icns MacSnap.app/Contents/Resources/AppIcon.icns
          fi
          codesign --force --deep --sign - MacSnap.app
          codesign --verify --strict --deep MacSnap.app
          zip -r -y MacSnap.app.zip MacSnap.app

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacSnap.app.zip
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MacSnap ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
